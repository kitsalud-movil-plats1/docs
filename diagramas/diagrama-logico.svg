<line x1="1040.0" y1="280" x2="1040.0" y2="390" stroke="#333333" stroke-width="3"/>
<rect x="983.0" y="313.0" width="114" height="22" fill="#FFFFFF"/>
<text x="1040.0" y="328.0" font-size="12" text-anchor="middle">WAN - VLAN 900</text>
<line x1="1040.0" y1="530" x2="1040.0" y2="580" stroke="#333333" stroke-width="3"/>
<line x1="451.0" y1="620" x2="451.0" y2="700" stroke="#424242" stroke-width="3"/>
<line x1="951.0" y1="620" x2="951.0" y2="700" stroke="#424242" stroke-width="3"/>
<line x1="1451.0" y1="620" x2="1451.0" y2="700" stroke="#424242" stroke-width="3"/>
<line x1="1951.0" y1="620" x2="1951.0" y2="700" stroke="#424242" stroke-width="3"/>
