<text x="1440.0" y="791.1000000000001" font-size="12" text-anchor="middle" fill="#111111">10.20.40.0/24</text>
<text x="1440.0" y="807.3000000000001" font-size="12" text-anchor="middle" fill="#111111">fd5a:fc7e:d716:40::/64</text>
<text x="1440.0" y="823.5000000000001" font-size="12" text-anchor="middle" fill="#111111">DHCPv4 + SLAAC con RDNSS</text>
<rect x="1300" y="890" width="280" height="90" rx="6" fill="#FFFFFF" stroke="#EF6C00" stroke-width="2"/>
<text x="1440.0" y="923.0" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">Visitantes y sala de espera</tspan></text>
