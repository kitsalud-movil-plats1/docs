<text x="640.0" y="1183.0" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">files01</tspan> - Samba SMB + NFS</text>
<text x="640.0" y="1199.2" font-size="12" text-anchor="middle" fill="#111111">10.20.20.12 | fd5a:fc7e:d716:20::12</text>
