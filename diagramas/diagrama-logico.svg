<text x="1840.0" y="955.4" font-size="12" text-anchor="middle" fill="#111111">Docker Compose</text>
<rect x="1700" y="1020" width="280" height="90" rx="6" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="2"/>
<text x="1840.0" y="1053.0" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">Kiwix-serve</tspan> (en dmz01)</text>
