<text x="1440.0" y="955.4" font-size="12" text-anchor="middle" fill="#111111">SSID SaludMovil-Comunidad (abierta)</text>
<rect x="1300" y="1020" width="280" height="90" rx="6" fill="#FFFFFF" stroke="#EF6C00" stroke-width="2"/>
<text x="1440.0" y="1053.0" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">Portal cautivo (fw01)</tspan></text>
<text x="1440.0" y="1069.2" font-size="12" text-anchor="middle" fill="#111111">portal.salud.movil - 10.20.40.1</text>
<text x="1440.0" y="1085.4" font-size="12" text-anchor="middle" fill="#111111">aceptar condiciones antes de salir</text>
<rect x="1300" y="1150" width="280" height="90" rx="6" fill="#FFFFFF" stroke="#EF6C00" stroke-width="2"/>
<text x="1440.0" y="1183.0" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">Política</tspan></text>
<text x="1440.0" y="1199.2" font-size="12" text-anchor="middle" fill="#111111">solo DMZ + DNS/NTP; Internet solo v4</text>
<text x="1440.0" y="1215.4" font-size="12" text-anchor="middle" fill="#111111">sin acceso a VLAN 10/20/30</text>
