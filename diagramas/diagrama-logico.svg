<text x="1840.0" y="1183.0" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">App de formularios</tspan> (en dmz01)</text>
<text x="1840.0" y="1199.2" font-size="12" text-anchor="middle" fill="#111111">registro.salud.movil</text>
<text x="1840.0" y="1215.4" font-size="12" text-anchor="middle" fill="#111111">datos en PostgreSQL de apps01</text>
