<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1660" viewBox="0 0 2100 1660" font-family="Liberation Sans, Arial, sans-serif">
<rect width="2100" height="1660" fill="#FFFFFF"/>
<rect x="20" y="330" width="2060" height="1310" rx="18" fill="#FAFAFA" stroke="#2E7D32" stroke-width="3"/>
<rect x="20" y="292" width="930.8" height="30" rx="4" fill="#2E7D32"/>
<text x="30" y="313" font-size="17" fill="#FFFFFF">KIT MÓVIL - nodos KVM (kvm01 + kvm02/kvm03 opcionales) + switch SG350X + AP multi-SSID (UPS lógica)</text>
<rect x="60" y="700" width="460" height="910" rx="6" fill="#FDECEA" stroke="#C62828" stroke-width="2"/>
<rect x="60" y="662" width="176.39999999999998" height="30" rx="4" fill="#C62828"/>
<text x="70" y="683" font-size="17" fill="#FFFFFF">VLAN 10 - Gestión</text>
<rect x="100" y="740" width="380" height="110" rx="6" fill="#FFFFFF" stroke="#C62828" stroke-width="2" stroke-dasharray="10,6"/>
<text x="290.0" y="774.9000000000001" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">Gestión</tspan></text>
<text x="290.0" y="791.1000000000001" font-size="12" text-anchor="middle" fill="#111111">10.20.10.0/24</text>
<text x="290.0" y="807.3000000000001" font-size="12" text-anchor="middle" fill="#111111">fd5a:fc7e:d716:10::/64</text>
<text x="290.0" y="823.5000000000001" font-size="12" text-anchor="middle" fill="#111111">Estático + reservas DHCP (solo cable)</text>
<rect x="100" y="880" width="380" height="90" rx="6" fill="#FFFFFF" stroke="#C62828" stroke-width="2"/>
<text x="290.0" y="913.0" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">sw01</tspan> - Cisco SG350X-24</text>
<text x="290.0" y="929.2" font-size="12" text-anchor="middle" fill="#111111">10.20.10.2 | fd5a:fc7e:d716:10::2</text>
<text x="290.0" y="945.4" font-size="12" text-anchor="middle" fill="#111111">trunk 802.1Q hacia kvm01 / ap01</text>
<rect x="100" y="1000" width="380" height="90" rx="6" fill="#FFFFFF" stroke="#C62828" stroke-width="2"/>
<text x="290.0" y="1033.0" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">ap01</tspan> - AP multi-SSID</text>
<text x="290.0" y="1049.2" font-size="12" text-anchor="middle" fill="#111111">10.20.10.3 | fd5a:fc7e:d716:10::3</text>
<text x="290.0" y="1065.4" font-size="12" text-anchor="middle" fill="#111111">SSID Clínica (30) y Comunidad (40)</text>
<rect x="100" y="1120" width="380" height="90" rx="6" fill="#FFFFFF" stroke="#C62828" stroke-width="2"/>
<text x="290.0" y="1153.0" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">kvm01</tspan> - nodo principal (KVM)</text>
<text x="290.0" y="1169.2" font-size="12" text-anchor="middle" fill="#111111">10.20.10.5 | fd5a:fc7e:d716:10::5</text>
<text x="290.0" y="1185.4" font-size="12" text-anchor="middle" fill="#111111">aloja fw01 e infra01; NUT (UPS simulada)</text>
<rect x="100" y="1240" width="380" height="90" rx="6" fill="#FFFFFF" stroke="#C62828" stroke-width="2"/>
<text x="290.0" y="1273.0" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">kvm02 / kvm03</tspan> - nodos opcionales</text>
<text x="290.0" y="1289.2" font-size="12" text-anchor="middle" fill="#111111">10.20.10.6-7 | fd5a:fc7e:d716:10::6-7</text>
<text x="290.0" y="1305.4" font-size="12" text-anchor="middle" fill="#111111">laptops del grupo (perfiles 2 y 3)</text>
<rect x="100" y="1360" width="380" height="90" rx="6" fill="#FFFFFF" stroke="#C62828" stroke-width="2"/>
<text x="290.0" y="1393.0" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">Equipos del personal técnico</tspan></text>
<text x="290.0" y="1409.2" font-size="12" text-anchor="middle" fill="#111111">reservas 10.20.10.100-119 (cable)</text>
<text x="290.0" y="1425.4" font-size="12" text-anchor="middle" fill="#111111">SSH/HTTPS de gestión solo desde aquí</text>
<rect x="560" y="700" width="460" height="910" rx="6" fill="#E8F0FE" stroke="#1565C0" stroke-width="2"/>
<rect x="560" y="662" width="204.0" height="30" rx="4" fill="#1565C0"/>
<text x="570" y="683" font-size="17" fill="#FFFFFF">VLAN 20 - Servidores</text>
<rect x="600" y="740" width="380" height="110" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="2" stroke-dasharray="10,6"/>
<text x="790.0" y="774.9000000000001" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">Servidores</tspan></text>
<text x="790.0" y="791.1000000000001" font-size="12" text-anchor="middle" fill="#111111">10.20.20.0/24</text>
<text x="790.0" y="807.3000000000001" font-size="12" text-anchor="middle" fill="#111111">fd5a:fc7e:d716:20::/64</text>
<text x="790.0" y="823.5000000000001" font-size="12" text-anchor="middle" fill="#111111">Estático (IPv6 espejo de IPv4)</text>
<rect x="600" y="880" width="380" height="90" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="2"/>
<text x="790.0" y="913.0" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">infra01</tspan> - BIND9 + Chrony</text>
<text x="790.0" y="929.2" font-size="12" text-anchor="middle" fill="#111111">10.20.20.10 | fd5a:fc7e:d716:20::10</text>
<text x="790.0" y="945.4" font-size="12" text-anchor="middle" fill="#111111">ns1 / ntp.salud.movil (VM infra01)</text>
<rect x="600" y="1000" width="380" height="90" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="2"/>
<text x="790.0" y="1033.0" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">dc01</tspan> - Samba AD DC</text>
<text x="790.0" y="1049.2" font-size="12" text-anchor="middle" fill="#111111">10.20.20.11 | fd5a:fc7e:d716:20::11</text>
<text x="790.0" y="1065.4" font-size="12" text-anchor="middle" fill="#111111">ad.salud.movil (rol en la VM infra01)</text>
<rect x="600" y="1120" width="380" height="90" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="2"/>
<text x="790.0" y="1153.0" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">files01</tspan> - SMB, NFS, backups</text>
<text x="790.0" y="1169.2" font-size="12" text-anchor="middle" fill="#111111">10.20.20.12 | fd5a:fc7e:d716:20::12</text>
<text x="790.0" y="1185.4" font-size="12" text-anchor="middle" fill="#111111">archivos.salud.movil (rol en la VM ops01)</text>
<rect x="600" y="1240" width="380" height="90" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="2"/>
<text x="790.0" y="1273.0" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">apps01</tspan> - DHIS2 + PostgreSQL</text>
<text x="790.0" y="1289.2" font-size="12" text-anchor="middle" fill="#111111">10.20.20.13 | fd5a:fc7e:d716:20::13</text>
<text x="790.0" y="1305.4" font-size="12" text-anchor="middle" fill="#111111">pacientes.salud.movil + BD de formularios</text>
<rect x="600" y="1360" width="380" height="90" rx="6" fill="#FEF7E0" stroke="#EF6C00" stroke-width="2"/>
<text x="790.0" y="1384.9" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">web01</tspan> - Caddy, Kiwix, formularios</text>
<text x="790.0" y="1401.1000000000001" font-size="12" text-anchor="middle" fill="#111111">10.20.20.15 | fd5a:fc7e:d716:20::15</text>
<text x="790.0" y="1417.3000000000002" font-size="12" text-anchor="middle" fill="#111111">biblioteca / registro.salud.movil</text>
<text x="790.0" y="1433.5" font-size="12" text-anchor="middle" fill="#111111">único host de la VLAN 20 abierto a invitados</text>
<rect x="600" y="1480" width="380" height="90" rx="6" fill="#FFFFFF" stroke="#1565C0" stroke-width="2"/>
<text x="790.0" y="1513.0" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">mon01</tspan> - Prometheus, Grafana, rsyslog</text>
<text x="790.0" y="1529.2" font-size="12" text-anchor="middle" fill="#111111">10.20.20.14 | fd5a:fc7e:d716:20::14</text>
<text x="790.0" y="1545.4" font-size="12" text-anchor="middle" fill="#111111">monitoreo.salud.movil (rol en la VM ops01)</text>
<rect x="1060" y="700" width="460" height="910" rx="6" fill="#E6F4EA" stroke="#2E7D32" stroke-width="2"/>
<rect x="1060" y="662" width="231.6" height="30" rx="4" fill="#2E7D32"/>
<text x="1070" y="683" font-size="17" fill="#FFFFFF">VLAN 30 - Clínica/Admin</text>
<rect x="1100" y="740" width="380" height="110" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2" stroke-dasharray="10,6"/>
<text x="1290.0" y="774.9000000000001" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">Clínica/Admin</tspan></text>
<text x="1290.0" y="791.1000000000001" font-size="12" text-anchor="middle" fill="#111111">10.20.30.0/24</text>
<text x="1290.0" y="807.3000000000001" font-size="12" text-anchor="middle" fill="#111111">fd5a:fc7e:d716:30::/64</text>
<text x="1290.0" y="823.5000000000001" font-size="12" text-anchor="middle" fill="#111111">DHCPv4 + SLAAC + DHCPv6 stateless</text>
<rect x="1100" y="880" width="380" height="90" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
<text x="1290.0" y="913.0" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">Estaciones personal de salud</tspan></text>
<text x="1290.0" y="929.2" font-size="12" text-anchor="middle" fill="#111111">DHCP 10.20.30.100-199</text>
<text x="1290.0" y="945.4" font-size="12" text-anchor="middle" fill="#111111">cable + SSID SaludMovil-Clinica</text>
<rect x="1100" y="1000" width="380" height="90" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
<text x="1290.0" y="1033.0" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">Acceso permitido</tspan></text>
<text x="1290.0" y="1049.2" font-size="12" text-anchor="middle" fill="#111111">pacientes, archivos, registro (consulta)</text>
<text x="1290.0" y="1065.4" font-size="12" text-anchor="middle" fill="#111111">DNS/NTP en infra01, login AD</text>
<rect x="1560" y="700" width="460" height="910" rx="6" fill="#FEF7E0" stroke="#EF6C00" stroke-width="2"/>
<rect x="1560" y="662" width="286.79999999999995" height="30" rx="4" fill="#EF6C00"/>
<text x="1570" y="683" font-size="17" fill="#FFFFFF">VLAN 40 - Comunidad/Invitados</text>
<rect x="1600" y="740" width="380" height="110" rx="6" fill="#FFFFFF" stroke="#EF6C00" stroke-width="2" stroke-dasharray="10,6"/>
<text x="1790.0" y="774.9000000000001" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">Comunidad/Invitados</tspan></text>
<text x="1790.0" y="791.1000000000001" font-size="12" text-anchor="middle" fill="#111111">10.20.40.0/24</text>
<text x="1790.0" y="807.3000000000001" font-size="12" text-anchor="middle" fill="#111111">fd5a:fc7e:d716:40::/64</text>
<text x="1790.0" y="823.5000000000001" font-size="12" text-anchor="middle" fill="#111111">DHCPv4 + SLAAC con RDNSS</text>
<rect x="1600" y="880" width="380" height="90" rx="6" fill="#FFFFFF" stroke="#EF6C00" stroke-width="2"/>
<text x="1790.0" y="913.0" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">Visitantes y sala de espera</tspan></text>
<text x="1790.0" y="929.2" font-size="12" text-anchor="middle" fill="#111111">DHCP 10.20.40.100-250</text>
<text x="1790.0" y="945.4" font-size="12" text-anchor="middle" fill="#111111">SSID SaludMovil-Comunidad (abierta)</text>
<rect x="1600" y="1000" width="380" height="90" rx="6" fill="#FFFFFF" stroke="#EF6C00" stroke-width="2"/>
<text x="1790.0" y="1033.0" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">Portal cautivo (fw01)</tspan></text>
<text x="1790.0" y="1049.2" font-size="12" text-anchor="middle" fill="#111111">portal.salud.movil - 10.20.40.1</text>
<text x="1790.0" y="1065.4" font-size="12" text-anchor="middle" fill="#111111">aceptar condiciones antes de salir</text>
<rect x="1600" y="1120" width="380" height="90" rx="6" fill="#FFFFFF" stroke="#EF6C00" stroke-width="2"/>
<text x="1790.0" y="1144.9" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">Política</tspan></text>
<text x="1790.0" y="1161.1000000000001" font-size="12" text-anchor="middle" fill="#111111">solo web01 (80/443) + DNS/NTP</text>
<text x="1790.0" y="1177.3000000000002" font-size="12" text-anchor="middle" fill="#111111">Internet solo IPv4 tras el portal</text>
<text x="1790.0" y="1193.5" font-size="12" text-anchor="middle" fill="#111111">sin acceso a VLAN 10, 30 ni al resto de la 20</text>
<ellipse cx="1040.0" cy="75.0" rx="130.0" ry="55.0" fill="#ECEFF1" stroke="#607D8B" stroke-width="2"/>
<text x="1040.0" y="70.77499999999999" font-size="13" text-anchor="middle" fill="#111111"><tspan font-weight="bold">Internet</tspan></text>
<text x="1040.0" y="88.32499999999999" font-size="13" text-anchor="middle" fill="#111111">red de la universidad</text>
<rect x="915" y="190" width="250" height="90" rx="6" fill="#ECEFF1" stroke="#607D8B" stroke-width="2"/>
<text x="1040.0" y="223.0" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">MikroTik RB3011</tspan></text>
<text x="1040.0" y="239.2" font-size="12" text-anchor="middle" fill="#111111">uplink del sitio (fuera del kit)</text>
<text x="1040.0" y="255.4" font-size="12" text-anchor="middle" fill="#111111">192.168.88.0/24</text>
<rect x="850" y="390" width="380" height="140" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
<text x="1040.0" y="431.8" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">fw01 - OPNsense (VM en kvm01)</tspan></text>
<text x="1040.0" y="448.0" font-size="12" text-anchor="middle" fill="#111111">WAN: VLAN 900, DHCP del RB3011</text>
<text x="1040.0" y="464.20000000000005" font-size="12" text-anchor="middle" fill="#111111">gateway .1 / ::1 en cada VLAN</text>
<text x="1040.0" y="480.40000000000003" font-size="12" text-anchor="middle" fill="#111111">Kea DHCPv4, RA/DHCPv6, portal cautivo</text>
<text x="1040.0" y="496.6" font-size="12" text-anchor="middle" fill="#111111">NAT44 + filtro IPv4/IPv6 (default deny)</text>
<rect x="80" y="390" width="560" height="140" rx="6" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="2" stroke-dasharray="10,6"/>
<text x="360.0" y="439.9" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">Router-on-a-stick</tspan></text>
<text x="360.0" y="456.09999999999997" font-size="12" text-anchor="middle" fill="#111111">kvm01 -- trunk 802.1Q --&gt; sw01</text>
<text x="360.0" y="472.29999999999995" font-size="12" text-anchor="middle" fill="#111111">VLANs 10,20,30,40 + 900 (WAN); nativa 999 (parking)</text>
<text x="360.0" y="488.5" font-size="12" text-anchor="middle" fill="#111111">kvm02/kvm03: trunk solo con VLAN 10 y 20</text>
<rect x="1440" y="390" width="560" height="140" rx="6" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="2" stroke-dasharray="10,6"/>
<text x="1720.0" y="439.9" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">IPv6</tspan>: ULA fd5a:fc7e:d716::/48 (RFC 4193)</text>
<text x="1720.0" y="456.09999999999997" font-size="12" text-anchor="middle" fill="#111111">un /64 por VLAN (subred = ID de VLAN)</text>
<text x="1720.0" y="472.29999999999995" font-size="12" text-anchor="middle" fill="#111111">GUA opcional por DHCPv6-PD si el uplink la entrega</text>
<text x="1720.0" y="488.5" font-size="12" text-anchor="middle" fill="#111111">reglas de firewall equivalentes en v4 y v6</text>
<rect x="60" y="580" width="1960" height="40" rx="6" fill="#EEEEEE" stroke="#424242" stroke-width="2"/>
<text x="1040.0" y="604.2" font-size="12" text-anchor="middle" fill="#111111"><tspan font-weight="bold">sw01 - trunk 802.1Q</tspan> (VLAN 10, 20, 30, 40 etiquetadas; 900 WAN; nativa 999)</text>
